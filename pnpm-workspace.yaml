packages:
  - packages/*

publicHoistPattern:
  - "*sqlite3*"
  - "*express*"

onlyBuiltDependencies:
  - "@karinjs/sqlite3-cjs"
  - canvas
  - sqlite3
  - sharp
  - puppeteer
  - classic-level
  - "@karinjs/node-pty"
lockfile: false
allowBuilds:
  "@karinjs/node-pty": true
  "@karinjs/sqlite3-cjs": true
  canvas: true
  sqlite3: true
  sharp: true
  puppeteer: true
  classic-level: true
strictDepBuilds: false
minimumReleaseAge: 0
blockExoticSubdeps: false
